# High-Frequency Triangular Arbitrage Configuration

backtest:
  # Using last 5 days so 1m interval works with yfinance
  start_date: "2024-05-15"
  end_date: "2024-05-20"
  initial_capital: 1000000.0
  interval: "1m"

universe:
  triplet:
    - EURUSD=X
    - USDJPY=X
    - EURJPY=X

execution:
  commission_fixed: 0.0 # HFT usually has volume-tiered, so we'll just use bps
  commission_pct: 0.0001 # 1 bps commission
  slippage_bps: 0.5 # tight simulated slippage
  spread_bps: 1.0 # simulated bid/ask spread

portfolio:
  sizing_method: "equal_weight"
  max_position_weight: 0.20
  rebalance_freq: "M"
